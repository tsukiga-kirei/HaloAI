name: haloai-local

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: haloai
      POSTGRES_USER: haloai
      # 仅用于本机开发；生产部署必须由密钥管理系统提供高强度凭据。
      POSTGRES_PASSWORD: haloai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - haloai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haloai -d haloai"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  haloai_postgres:
